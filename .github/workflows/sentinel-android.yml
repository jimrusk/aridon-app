name: Sentinel Android
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Unit tests
        working-directory: android-sentinel
        run: gradle testDebugUnitTest
      - name: Build APK
        working-directory: android-sentinel
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-mobile-debug-apk
          path: android-sentinel/app/build/outputs/apk/debug/app-debug.apk
