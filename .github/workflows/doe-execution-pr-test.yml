name: DOE execution review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-team:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run and score DOE projects
        shell: python
        run: |
          import json, time, urllib.request, urllib.error
          from pathlib import Path

          endpoint = "https://aridon-v02.vercel.app/api/execution"
          out = Path("execution-test-results")
          out.mkdir(exist_ok=True)

          projects = {
            "paducah": {
              "title": "Paducah GridCore Entry Package",
              "projectType": "Data-center electrical proposal",
              "objective": "Create a complete outreach-ready supplier entry package positioning Aridon GridCore for the DOE Paducah American Energy Hub, with a 250 kW demonstrator scaling to a 5 MW critical-power cell.",
              "audience": "DOE PPPO small business office, Brookfield, NextEra Energy, Big Rivers Electric, Jackson Purchase Energy, Paducah Power System, and relevant prime contractors.",
              "constraints": "Use only supplied facts. Do not invent contacts, certifications, performance guarantees, source citations, or pricing. Clearly label assumptions and verification needs. Hold outbound messages, engineering claims, spending, and contractual commitments for human approval.",
              "requestedOutputs": ["Executive opportunity brief", "250 kW prototype architecture", "5 MW commercial cell concept", "Paducah capability statement", "Stakeholder and supplier-entry map", "Supplier introduction email", "Small-business outreach email", "Registration and qualification checklist", "90-day action plan"]
            },
            "los-alamos": {
              "title": "Los Alamos Remote Resilience Pilot",
              "projectType": "Pilot outreach package",
              "objective": "Create a complete outreach-ready pilot package for a non-safety-class Aridon Remote Resilience Pod supporting remote monitoring, groundwater investigation, temporary field operations, communications, and resilient power needs associated with Los Alamos legacy cleanup.",
              "audience": "DOE EM Los Alamos Field Office, N3B small business and procurement personnel, technical program managers, and potential engineering partners.",
              "constraints": "Do not claim qualification for nuclear safety systems or radiological work. Treat all site applications as conceptual and subject to DOE, contractor, environmental, cybersecurity, fire-protection, and licensed-engineering review. Do not invent contacts, field conditions, certifications, or prices. Hold outbound messages and engineering claims for human approval.",
              "requestedOutputs": ["Executive pilot brief", "Remote Resilience Pod use-case matrix", "Conceptual electrical and communications architecture", "Preliminary equipment schedule", "Paid feasibility scope", "N3B capability statement", "Small-business introduction email", "Pilot discovery questions", "Safety and regulatory limitations", "60-day engagement plan"]
            },
            "genesis": {
              "title": "Genesis Infrastructure Intelligence Concept",
              "projectType": "Custom execution package",
              "objective": "Create a partnership-ready concept for physics-informed AI applied to critical power, battery integration, AI-load smoothing, water-energy optimization, and infrastructure resilience for potential collaboration with DOE Genesis Mission participants, national laboratories, universities, and DOE contractors.",
              "audience": "DOE national laboratories, Genesis Mission project teams, infrastructure researchers, university partners, engineering firms, and federal prime contractors.",
              "constraints": "Do not imply selection, endorsement, validated performance, laboratory partnership, intellectual-property ownership, or scientific results that do not exist. Separate proposed research from demonstrated capability. Hold external submissions, IP decisions, engineering claims, and partnership commitments for human approval.",
              "requestedOutputs": ["Partnership concept paper", "GridCore digital-twin description", "Physics and sensor-data framework", "AI load-shock-absorber research concept", "Research questions and hypotheses", "Demonstration requirements", "Potential partner categories", "Intellectual-property decision map", "Partner outreach email", "90-day research partnership plan"]
            }
          }

          def run(payload):
            body = json.dumps(payload).encode()
            last_error = None
            for attempt in range(3):
              try:
                req = urllib.request.Request(endpoint, data=body, headers={"Content-Type": "application/json"}, method="POST")
                with urllib.request.urlopen(req, timeout=240) as response:
                  return json.loads(response.read().decode())
              except Exception as exc:
                last_error = exc
                time.sleep(5)
            raise last_error

          expected = {"paducah": 9, "los-alamos": 10, "genesis": 10}
          scorecard = {"projects": {}, "overall_pass": True}

          for name, payload in projects.items():
            result = run(payload)
            (out / f"{name}.json").write_text(json.dumps(result, indent=2))
            deliverables = result.get("deliverables") or []
            agents = result.get("agents") or []
            checks = {
              "summary": len(result.get("executiveSummary", "")) >= 120,
              "definition_of_done": len(result.get("definitionOfDone") or []) >= 4,
              "team": len(agents) >= 6,
              "deliverables": len(deliverables) >= expected[name],
              "substantive_content": all(len(item.get("content", "")) >= 180 for item in deliverables),
              "quality_checks": all(item.get("qualityChecks") for item in deliverables),
              "approval_gates": any(item.get("approvalRequired") for item in deliverables),
              "final_checks": len(result.get("finalChecks") or []) >= 3,
              "reviewable_status": result.get("status") in {"ready_for_approval", "complete"}
            }
            passed = all(checks.values())
            scorecard["projects"][name] = {
              "passed": passed,
              "checks": checks,
              "deliverable_count": len(deliverables),
              "agent_count": len(agents),
              "status": result.get("status"),
              "storageStatus": result.get("storageStatus"),
              "deliverable_titles": [item.get("title") for item in deliverables]
            }
            scorecard["overall_pass"] &= passed

          (out / "scorecard.json").write_text(json.dumps(scorecard, indent=2))
          print(json.dumps(scorecard, indent=2))
          if not scorecard["overall_pass"]:
            raise SystemExit("DOE execution output failed one or more release gates")

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doe-execution-team-results
          path: execution-test-results
          if-no-files-found: error
          retention-days: 30
