name: Build Aridon Desktop

on:
  push:
    branches:
      - feature/desktop-essentials
    paths:
      - 'desktop/**'
      - '.github/workflows/build-aridon-desktop.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: Aridon-Windows
          path: desktop/dist/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with:
          name: Aridon-macOS
          path: desktop/dist/*
          if-no-files-found: error
